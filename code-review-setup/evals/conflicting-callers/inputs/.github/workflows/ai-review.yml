name: AI review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: tesslio/code-review-action@main
        with:
          tessl-token: ${{ secrets.TESSL_TOKEN }}
          mode: gate
