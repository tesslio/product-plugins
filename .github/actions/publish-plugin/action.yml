name: Publish an immutable Tessl package
description: Publish or verify the exact package version in one explicit registry.
inputs:
  path:
    description: Package directory in the caller checkout
    required: true
  name:
    description: Expected workspace/package name
    required: true
  version:
    description: Expected immutable package version
    required: true
  target:
    description: CLI environment (production or app-eu)
    required: true
  api-url:
    description: Expected API origin for the target
    required: true
  token:
    description: Token scoped to the target registry and publishing workspace
    required: true
runs:
  using: composite
  steps:
    - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
      with:
        version: '0.109.0'
    - name: Reconcile package version
      shell: bash
      env:
        PUBLISH_PATH: ${{ inputs.path }}
        PUBLISH_NAME: ${{ inputs.name }}
        PUBLISH_VERSION: ${{ inputs.version }}
        PUBLISH_TARGET: ${{ inputs.target }}
        PUBLISH_API_URL: ${{ inputs.api-url }}
        TESSL_PUBLISH_TOKEN: ${{ inputs.token }}
        PUBLISH_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$PUBLISH_ACTION_PATH/publish.py"
