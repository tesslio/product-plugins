name: publish

# Publish every plugin whose files changed when a commit lands on main.
on:
  push:
    branches: [main]

# Serialize publishes so overlapping merges don't race the registry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugins (${{ matrix.target.environment }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - environment: production
            token: TESSL_TOKEN
          - environment: app-eu
            token: TESSL_TOKEN_EU
    env:
      TESSL_ENV: ${{ matrix.target.environment }}
      TESSL_TOKEN: ${{ secrets[matrix.target.token] }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need the previous commit (github.event.before) to diff against.
          fetch-depth: 0
          # Publishing authenticates with TESSL_TOKEN, not the git credential.
          persist-credentials: false

      - name: Check publishing token
        run: test -n "$TESSL_TOKEN"

      - name: Install Tessl CLI
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ env.TESSL_TOKEN }}

      - name: Publish changed plugins
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: .github/scripts/publish-changed.sh "$BEFORE_SHA" "$AFTER_SHA"
