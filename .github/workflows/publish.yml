name: publish

# Reconcile the whole inventory so failed or superseded pushes are recovered.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Registry to reconcile
        type: choice
        default: both
        options: [both, production, app-eu]
      package:
        description: Top-level package directory (empty means all)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan required package versions
        id: plan
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          SELECTED_TARGET: ${{ inputs.target || 'both' }}
        run: |
          set -euo pipefail
          packages=$(python3 .github/actions/publish-plugin/inventory.py \
            --root . --package "$SELECTED_PACKAGE" --backfills .github/publish-backfills.json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          case "$SELECTED_TARGET" in
            both) targets='["production","app-eu"]' ;;
            production) targets='["production"]' ;;
            app-eu) targets='["app-eu"]' ;;
            *) echo "Unknown target" >&2; exit 1 ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          printf 'Required versions: `%s`\n\nTargets: `%s`\n' "$packages" "$targets" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    name: ${{ matrix.package.name }}@${{ matrix.package.version }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: registry-${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      # Helpers always come from the triggering main commit, even for backfills.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.package.ref }}
          path: _source
          persist-credentials: false
      - uses: ./.github/actions/publish-plugin
        with:
          path: _source/${{ matrix.package.path }}
          name: ${{ matrix.package.name }}
          version: ${{ matrix.package.version }}
          target: ${{ matrix.target }}
          api-url: ${{ matrix.target == 'app-eu' && 'https://api.eu.tessl.io' || 'https://api.tessl.io' }}
          token: ${{ secrets.TESSL_PUBLISH_TOKEN }}
