name: Publishing tests
on:
  pull_request:
    paths:
      - '.github/actions/publish-plugin/**'
      - '.github/workflows/publish*.yml'
      - '.github/publish-backfills.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/actions/publish-plugin -p 'test_*.py' -v
      - run: python3 .github/actions/publish-plugin/inventory.py --root . --backfills .github/publish-backfills.json
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck=
